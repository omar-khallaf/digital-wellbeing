[package]
name = "wellbeing-daemon"
version.workspace = true
edition.workspace = true

[[bin]]
name = "wellbeing-daemon"
path = "src/main/mod.rs"

[dependencies]
wellbeing-core = { path = "../core" }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "sync", "time", "signal", "fs"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = { version = "0.7" }
thiserror.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true

chrono.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zbus.workspace = true
zvariant.workspace = true
nix = { version = "0.31", features = ["user"] }
futures = "0.3"
turso = { version = "0.7.1", default-features = false, features = ["mimalloc"] }

[dev-dependencies]
tempfile = "3"
